name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pytest
      - run: python -m pytest

  build-and-test-distributions:
    name: Build and test distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel --sdist --outdir "$RUNNER_TEMP/dist"
      - name: Install and test each built distribution in isolation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/installed-check"
          for artifact in "$RUNNER_TEMP"/dist/*; do
            name="$(basename "$artifact")"
            env_dir="$RUNNER_TEMP/venv-${name//[^a-zA-Z0-9]/-}"
            check_dir="$RUNNER_TEMP/installed-check/${name//[^a-zA-Z0-9]/-}"
            python -m venv "$env_dir"
            "$env_dir/bin/python" -m pip install --upgrade pip pytest
            "$env_dir/bin/python" -m pip install "$artifact"
            mkdir -p "$check_dir"
            (
              cd "$check_dir"
              "$env_dir/bin/python" -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/tests"
            )
          done
