version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    day: monday
    time: "09:00"
    timezone: Europe/Madrid
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Madrid
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
